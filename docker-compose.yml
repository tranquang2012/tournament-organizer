services:
  backend:
    build:
      context: ./backend
    container_name: tournament-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to your Supabase Postgres connection string}
      DB_SSL: ${DB_SSL:-true}
      DB_SSL_REJECT_UNAUTHORIZED: ${DB_SSL_REJECT_UNAUTHORIZED:-false}
      SUPABASE_URL: ${SUPABASE_URL:?Set SUPABASE_URL to your Supabase project URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:?Set SUPABASE_ANON_KEY to your Supabase anon or publishable key}
      EMAIL_REMINDERS_ENABLED: ${EMAIL_REMINDERS_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_SERVICE: ${SMTP_SERVICE:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      REMINDER_DAYS_BEFORE: ${REMINDER_DAYS_BEFORE:-1}
      REMINDER_TIME_ZONE: ${REMINDER_TIME_ZONE:-Asia/Ho_Chi_Minh}
      EMAIL_REMINDER_INTERVAL_MS: ${EMAIL_REMINDER_INTERVAL_MS:-900000}
      EMAIL_REMINDER_BATCH_SIZE: ${EMAIL_REMINDER_BATCH_SIZE:-100}
      REMINDER_CLAIM_STALE_MINUTES: ${REMINDER_CLAIM_STALE_MINUTES:-30}
    ports:
      # API is reached via nginx /api — do not expose 5000 publicly in production unless needed for debugging
      - "127.0.0.1:5000:5000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:?Set VITE_SUPABASE_URL to your Supabase project URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:?Set VITE_SUPABASE_ANON_KEY to your Supabase publishable or anon key}
        # Leave unset in production — nginx proxies /api to the backend container.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    container_name: tournament-frontend
    restart: unless-stopped
    environment:
      PUBLIC_IP: ${PUBLIC_IP:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - nginx-certs:/etc/nginx/certs
      - acme-webroot:/var/www/acme
    depends_on:
      - backend

  certbot:
    image: certbot/certbot:latest
    container_name: tournament-certbot
    restart: unless-stopped
    volumes:
      - nginx-certs:/etc/nginx/certs
      - acme-webroot:/var/www/acme
      - letsencrypt:/etc/letsencrypt
      - ./scripts/certbot-loop.sh:/certbot-loop.sh:ro
    environment:
      PUBLIC_IP: ${PUBLIC_IP:-}
      CERTBOT_EMAIL: ${CERTBOT_EMAIL:-}
    entrypoint: ["/bin/sh", "/certbot-loop.sh"]
    depends_on:
      - frontend

volumes:
  nginx-certs:
  acme-webroot:
  letsencrypt:
